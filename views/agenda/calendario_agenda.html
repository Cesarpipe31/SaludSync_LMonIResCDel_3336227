<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario Maestro de Agenda | SaludSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/styles.css" rel="stylesheet">
  <link href="../../assets/css/plataforma.css" rel="stylesheet">
  <link href="../../assets/css/agenda.css" rel="stylesheet">
</head>
<body data-page="calendario_agenda">

  <div id="app-header"></div>

  <main class="container-xl py-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-2">
        <li class="breadcrumb-item"><a href="../../index.html">Inicio</a></li>
        <li class="breadcrumb-item">Agenda</li>
        <li class="breadcrumb-item active" aria-current="page">Calendario maestro</li>
      </ol>
    </nav>

    <div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <span class="badge badge-mod">Pantalla 6.1</span>
        <h1 class="h3 fw-bold mb-0 mt-1">Calendario Maestro y Disponibilidad</h1>
        <p class="text-muted mb-0">Institución: <strong data-inst-nombre>—</strong></p>
      </div>
      <div class="d-flex gap-2">
        <a href="bloqueo_agenda.html" class="btn btn-outline-primary">⛔ Novedades</a>
        <a href="configurar_horario.html" class="btn btn-success">⏰ Configurar horario</a>
      </div>
    </div>

    <!-- Filtros -->
    <div class="card panel mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3"><label for="selProf" class="form-label small fw-semibold">Profesional</label><select id="selProf" class="form-select"></select></div>
          <div class="col-md-3"><label for="selEsp" class="form-label small fw-semibold">Especialidad</label><select id="selEsp" class="form-select"></select></div>
          <div class="col-6 col-md-2"><label for="selSede" class="form-label small fw-semibold">Sede</label><select id="selSede" class="form-select"></select></div>
          <div class="col-6 col-md-2"><label for="selCons" class="form-label small fw-semibold">Consultorio</label><select id="selCons" class="form-select"></select></div>
          <div class="col-md-2 d-flex flex-column gap-1">
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="chkOtros"><label class="form-check-label small" for="chkOtros">Ver borradores / inactivas</label></div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLimpiar">Limpiar filtros</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-3" id="kpis"></div>

    <!-- Navegación semanal -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <div class="btn-group" role="group" aria-label="Navegación de semana">
        <button type="button" class="btn btn-outline-primary" id="btnPrev" title="Semana anterior">‹</button>
        <button type="button" class="btn btn-outline-primary" id="btnHoy">Hoy</button>
        <button type="button" class="btn btn-outline-primary" id="btnNext" title="Semana siguiente">›</button>
      </div>
      <h2 class="h5 mb-0 fw-bold" id="tituloSemana"></h2>
      <div class="small">
        <span class="me-3"><span class="lgd lgd-pub"></span>Publicada</span>
        <span class="me-3"><span class="lgd lgd-bor"></span>Borrador</span>
        <span><span class="lgd lgd-bloq"></span>Bloqueo</span>
      </div>
    </div>

    <div class="card panel mb-4">
      <div class="cal-wrap"><div class="cal" id="cal"></div></div>
    </div>

    <!-- Novedades de la semana -->
    <div class="card panel mb-5">
      <div class="card-header section-title">⛔ Novedades que afectan esta semana</div>
      <div class="card-body" id="novedades"></div>
    </div>
  </main>

  <!-- Modal detalle de turno -->
  <div class="modal fade" id="modalAgenda" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="agTitulo">Turno</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body" id="agCuerpo"></div>
        <div class="modal-footer">
          <a href="#" class="btn btn-outline-danger" id="agBloquear">⛔ Bloquear</a>
          <a href="#" class="btn btn-primary" id="agEditar">✏️ Editar horario</a>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/agenda.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directorio de Pacientes | SaludSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/styles.css" rel="stylesheet">
  <link href="../../assets/css/plataforma.css" rel="stylesheet">
  <link href="../../assets/css/pacientes.css" rel="stylesheet">
</head>
<body data-page="directorio_pacientes">

  <div id="app-header"></div>

  <main class="container py-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-2">
        <li class="breadcrumb-item"><a href="../../index.html">Inicio</a></li>
        <li class="breadcrumb-item">Pacientes</li>
        <li class="breadcrumb-item active" aria-current="page">Directorio</li>
      </ol>
    </nav>

    <div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <span class="badge badge-mod">Pantalla 3.1</span>
        <h1 class="h3 fw-bold mb-0 mt-1">Directorio Maestro y Búsqueda de Pacientes</h1>
        <p class="text-muted mb-0">Institución: <strong data-inst-nombre>—</strong></p>
      </div>
      <a href="registro_paciente.html" class="btn btn-success">➕ Nuevo paciente</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-num" id="kpiTotal">0</div><div class="kpi-lbl">Pacientes</div></div></div>
      <div class="col-6 col-lg-3"><div class="kpi kpi-green"><div class="kpi-num" id="kpiActivos">0</div><div class="kpi-lbl">Activos</div></div></div>
      <div class="col-6 col-lg-3"><div class="kpi kpi-gray"><div class="kpi-num" id="kpiInactivos">0</div><div class="kpi-lbl">Inactivos</div></div></div>
      <div class="col-6 col-lg-3"><div class="kpi kpi-warn"><div class="kpi-num" id="kpiMenores">0</div><div class="kpi-lbl">Menores de 18 años</div></div></div>
    </div>

    <!-- Filtros -->
    <div class="card panel mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-5">
            <label for="buscador" class="form-label small fw-semibold">Buscar por documento, nombres o apellidos</label>
            <input type="search" id="buscador" class="form-control search-big" placeholder="Ej: 1100234567, Ana, Torres…" autocomplete="off">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtroTipo" class="form-label small fw-semibold">Tipo de documento</label>
            <select id="filtroTipo" class="form-select">
              <option value="">Todos</option><option>CC</option><option>TI</option><option>RC</option><option>CE</option><option>Pasaporte</option><option>PEP</option><option>PPT</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="filtroEstado" class="form-label small fw-semibold">Estado</label>
            <select id="filtroEstado" class="form-select"><option value="">Todos</option><option>Activo</option><option>Inactivo</option></select>
          </div>
          <div class="col-md-1 d-grid"><button type="button" id="btnLimpiar" class="btn btn-outline-secondary" title="Limpiar filtros">✖</button></div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card panel">
      <div class="table-responsive">
        <table class="table table-ss align-middle mb-0">
          <thead>
            <tr><th>Documento</th><th>Paciente</th><th>Edad / Sexo</th><th>Teléfono</th><th>EPS</th><th>Estado</th><th class="text-end">Acciones</th></tr>
          </thead>
          <tbody id="tablaPacientes"></tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
        <small class="text-muted" id="contador"></small>
        <nav aria-label="Paginación"><ul class="pagination pagination-sm mb-0" id="paginacion"></ul></nav>
      </div>
    </div>
  </main>

  <!-- Modal estado -->
  <div class="modal fade" id="modalEstado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="modalEstadoTitulo">Cambiar estado</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body" id="modalEstadoCuerpo"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarEstado">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/pacientes.js"></script>
</body>
</html>

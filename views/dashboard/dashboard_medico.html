<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Médico | SaludSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/styles.css" rel="stylesheet">
  <link href="../../assets/css/plataforma.css" rel="stylesheet">
  <link href="../../assets/css/dashboard.css" rel="stylesheet">
</head>
<body data-page="dashboard_medico">

  <div id="app-header"></div>

  <main class="container-xl py-4">
    <div class="alert alert-danger d-none" id="sinAcceso">🔒 Esta vista está reservada para profesionales de la salud. <a href="../../index.html" class="alert-link">Volver al inicio</a>.</div>

    <div id="contenido">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small mb-2">
          <li class="breadcrumb-item"><a href="../../index.html">Inicio</a></li>
          <li class="breadcrumb-item">Dashboard</li>
          <li class="breadcrumb-item active" aria-current="page">Médico</li>
        </ol>
      </nav>

      <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <span class="badge badge-mod">Pantalla 15.2</span>
          <h1 class="h3 fw-bold mb-0 mt-1" id="saludo">Dashboard médico</h1>
          <p class="text-muted mb-0"><span id="fechaHoy"></span> · <strong data-inst-nombre>—</strong></p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-end">
          <span class="live-chip"><span class="live-dot"></span><span class="reloj" id="reloj">--:--:--</span><span class="text-muted">· act. <span id="actualizado">—</span></span></span>
          <div style="min-width:260px"><label for="selProf" class="form-label small fw-semibold mb-1">Profesional</label><select id="selProf" class="form-select"></select><div class="form-text" id="ayudaProf"></div></div>
          <button type="button" class="btn btn-outline-primary" id="btnActualizar">↻ Actualizar</button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="kpis"></div>

      <div class="row g-3 mb-3">
        <div class="col-lg-7">
          <div id="turno" class="mb-3"></div>
          <div class="card panel">
            <div class="card-header section-title d-flex justify-content-between"><span>🪑 Cola de espera</span><small class="text-muted" id="nCola"></small></div>
            <div class="card-body py-2" id="cola"></div>
          </div>
        </div>
        <div class="col-lg-5 d-flex flex-column gap-3">
          <div class="card panel"><div class="card-header section-title">📅 Próximas citas en agenda</div><div class="card-body py-2" id="proximas"></div></div>
          <div class="card panel"><div class="card-header section-title d-flex justify-content-between"><span>📈 Seguimiento: controles por vencer</span><a href="../seguimiento/panel_seguimiento.html" class="small">Ver panel →</a></div><div class="card-body" id="alertasSeg"></div></div>
        </div>
      </div>

      <div class="row g-2 mb-5">
        <div class="col-md-4"><button type="button" class="btn-quick" data-go="../atencion/panel_asistencial.html"><span class="q-ico">🧑‍⚕️</span><span>Panel asistencial<small>Cola completa y atención</small></span></button></div>
        <div class="col-md-4"><button type="button" class="btn-quick" data-go="../agenda/calendario_agenda.html"><span class="q-ico">📆</span><span>Calendario de agenda<small>Mi disponibilidad</small></span></button></div>
        <div class="col-md-4"><button type="button" class="btn-quick" data-go="../seguimiento/programar_control.html"><span class="q-ico">➕</span><span>Programar control<small>Nuevo plan de seguimiento</small></span></button></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/dashboard.js"></script>
</body>
</html>
